services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: parc
      POSTGRES_PASSWORD: parc
      POSTGRES_DB: parc_assets
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parc -d parc_assets"]
      interval: 5s
      timeout: 5s
      retries: 10

  generator:
    build: ../data-engine/generator
    environment:
      DATABASE_URL: postgresql+psycopg2://parc:parc@postgres:5432/parc_assets
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  dbt-runner:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    working_dir: /usr/app
    entrypoint: ["/bin/sh", "-c", "dbt run --profiles-dir . && dbt test --profiles-dir ."]
    environment:
      PGHOST: postgres
      PGUSER: parc
      PGPASSWORD: parc
      PGDATABASE: parc_assets
    volumes: ["../data-engine/dbt-parc-assets:/usr/app"]
    depends_on:
      generator: {condition: service_completed_successfully}
    restart: "no"

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3000:3000"]
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-provisioning/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase-db:
    image: postgres:15
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.49.7
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase-db
      MB_EMBEDDING_ENABLED: "true"
      MB_ENABLE_EMBEDDING: "true"
      MB_EMBEDDING_APP_ORIGIN: "*"
    ports: ["3001:3000"]
    depends_on:
      metabase-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  metabase-init:
    image: python:3.11-slim
    working_dir: /init
    command: ["python", "init_metabase.py"]
    environment:
      MB_URL: http://metabase:3000
    volumes: ["./metabase-init:/init"]
    depends_on:
      metabase: {condition: service_healthy}
      dbt-runner: {condition: service_completed_successfully}
    restart: "no"

volumes:
  pgdata:
